<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Requirements -->
    <title>India Pincode Finder - Search Post Office & Zip Codes</title>
    <meta name="description" content="Find any Pincode or Post Office in India. Free, fast, and ad-free tool in Odia and English.">
    
    <!-- Unified Font for Odia and English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@100..900&display=swap" rel="stylesheet"> 
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans Oriya"', 'sans-serif'], },
                    colors: {
                        indigo: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 800: '#3730a3', 900: '#312e81', }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f8fafc; }
        .md3-transition { transition: all 0.3s cubic-bezier(0.2, 0, 0, 1); }
        input:focus { outline: none; }
        .card-enter { opacity: 0; transform: translateY(20px); }
        .card-enter-active { opacity: 1; transform: translateY(0); }
        
        .spinner {
            border: 4px solid #e0e7ff; 
            border-top: 4px solid #4f46e5; 
            border-radius: 50%;
            width: 44px; height: 44px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 font-sans min-h-screen flex flex-col relative">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 transition-opacity duration-300 opacity-0 pointer-events-none font-medium"></div>

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-4 px-6 shadow-md sticky top-0 z-20 flex justify-between items-center rounded-b-xl md3-transition">
        <h1 id="header-title" class="text-2xl font-bold tracking-wide cursor-pointer" onclick="goHome()">ଭାରତ ପିନକୋଡ୍ ଖୋଜନ୍ତୁ</h1>
        <button id="lang-toggle" onclick="toggleLanguage()" class="md3-transition bg-indigo-50 text-indigo-800 font-semibold py-1.5 px-6 rounded-full text-sm shadow hover:bg-white hover:shadow-md">
            English
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center px-4 py-12 w-full max-w-5xl mx-auto">
        
        <!-- Search Section -->
        <div class="w-full max-w-2xl relative flex flex-col items-center mb-10">
            <div class="w-full bg-indigo-50 p-2 border border-indigo-100 rounded-full shadow-sm flex items-center md3-transition focus-within:border-indigo-400 focus-within:shadow-md">
                <input 
                    type="text" 
                    id="pincode-input" 
                    class="w-full bg-transparent py-3 pl-6 pr-4 text-xl text-gray-800 placeholder-gray-500"
                    maxlength="6" 
                    pattern="\d*"
                    oninput="validateInput(this)"
                    placeholder="୬-ଅଙ୍କ ବିଶିଷ୍ଟ ପିନକୋଡ୍...">
                <button 
                    id="search-btn"
                    onclick="searchPincode()" 
                    class="md3-transition bg-indigo-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-indigo-700 hover:shadow-lg whitespace-nowrap">
                    ଖୋଜନ୍ତୁ
                </button>
            </div>
            <p id="error-msg" class="text-red-500 text-sm mt-4 hidden font-medium bg-red-50 px-4 py-2 rounded-full"></p>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="hidden flex-col items-center justify-center py-10">
            <div class="spinner mb-5"></div>
            <p id="loading-text" class="text-indigo-800 font-medium text-lg">ଅନୁସନ୍ଧାନ କରାଯାଉଛି...</p>
        </div>

        <!-- Results Summary Header -->
        <div id="result-summary" class="hidden w-full mb-8 flex flex-wrap items-center justify-between bg-white px-6 py-5 rounded-2xl shadow-sm border border-indigo-50 md3-transition">
            <div class="flex items-center gap-3">
                <button id="clear-filter-btn" onclick="clearFilter()" class="hidden bg-indigo-100 text-indigo-800 p-2 rounded-full hover:bg-indigo-200" title="Show All">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                </button>
                <h2 class="text-xl font-bold text-gray-800">
                    <span id="summary-text">ଫଳାଫଳ:</span> <span id="searched-pin" class="text-indigo-600 ml-1"></span>
                </h2>
            </div>
            <div class="flex gap-3 mt-4 sm:mt-0">
                <button onclick="copyPincode()" class="md3-transition flex items-center gap-2 bg-indigo-50 text-indigo-800 px-4 py-2 rounded-full font-medium hover:bg-indigo-100 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                    <span id="copy-btn-text">କପି କରନ୍ତୁ</span>
                </button>
                <button onclick="shareMainLink()" class="md3-transition flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-full font-medium hover:bg-indigo-700 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                    <span id="share-btn-text">ସେୟାର କରନ୍ତୁ</span>
                </button>
            </div>
        </div>

        <!-- Results Grid -->
        <div id="results-grid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-indigo-900 text-indigo-50 py-5 text-center mt-auto md3-transition rounded-t-xl">
        <a href="https://play.google.com/store/apps/dev?id=6501689567504406715" target="_blank" rel="noopener noreferrer" class="text-sm font-bold hover:text-white hover:underline md3-transition">
            <span id="footer-text">Sandeep Biswal Gଙ୍କ ଅନ୍ୟ ପ୍ରକଳ୍ପ ଦେଖନ୍ତୁ</span>
        </a>
    </footer>

    <script>
        // --- Settings & i18n ---
        let currentLang = localStorage.getItem('appLang') || 'or'; 
        let currentPostOffices = []; 
        let activeFilter = null;

        const i18n = {
            or: {
                title: "ଭାରତ ପିନକୋଡ୍ ଖୋଜନ୍ତୁ", toggleBtn: "English", placeholder: "୬-ଅଙ୍କ ବିଶିଷ୍ଟ ପିନକୋଡ୍...",
                searchBtn: "ଖୋଜନ୍ତୁ", poName: "ଉପ-ଡାକଘର", branchType: "ଶାଖା ପ୍ରକାର", delivery: "ବିତରଣ ସ୍ଥିତି",
                districtState: "ଜିଲ୍ଲା ଏବଂ ରାଜ୍ୟ", mapBtn: "ମାନଚିତ୍ରରେ ଦେଖନ୍ତୁ", copyBtn: "କପି କରନ୍ତୁ",
                shareBtn: "ସେୟାର କରନ୍ତୁ", copied: "କପି ହୋଇଛି!", linkCopied: "ଲିଙ୍କ୍ କପି ହୋଇଛି!",
                loading: "ଅନୁସନ୍ଧାନ କରାଯାଉଛି...", invalidLength: "ଦୟାକରି ସଠିକ୍ ୬-ଅଙ୍କ ବିଶିଷ୍ଟ ପିନକୋଡ୍ ଦିଅନ୍ତୁ।",
                noData: "କୌଣସି ତଥ୍ୟ ମିଳିଲା ନାହିଁ।", summaryText: "ଫଳାଫଳ:", 
                footerText: "Sandeep Biswal Gଙ୍କ ଅନ୍ୟ ପ୍ରକଳ୍ପ ଦେଖନ୍ତୁ", sharePO: "ଏହି ଡାକଘର ସେୟାର କରନ୍ତୁ"
            },
            en: {
                title: "India Pincode Finder", toggleBtn: "ଓଡ଼ିଆ", placeholder: "Enter 6-digit Pincode...",
                searchBtn: "Search", poName: "Post Office", branchType: "Branch Type", delivery: "Delivery Status",
                districtState: "District & State", mapBtn: "View on Map", copyBtn: "Copy Pin",
                shareBtn: "Share Link", copied: "Copied!", linkCopied: "Link Copied!",
                loading: "Searching...", invalidLength: "Please enter a valid 6-digit pincode.",
                noData: "No data found.", summaryText: "Results:", 
                footerText: "See other projects by Sandeep Biswal G", sharePO: "Share this Post Office"
            }
        };

        const elements = {
            input: document.getElementById('pincode-input'),
            error: document.getElementById('error-msg'),
            loading: document.getElementById('loading-state'),
            grid: document.getElementById('results-grid'),
            summary: document.getElementById('result-summary'),
            pinSpan: document.getElementById('searched-pin'),
            clearBtn: document.getElementById('clear-filter-btn')
        };

        // --- Core Functions ---
        window.addEventListener('DOMContentLoaded', () => {
            applyLanguage();
            handleRouting();
        });

        // Listen for back/forward navigation using Hashes
        window.addEventListener('hashchange', handleRouting);

        function goHome() {
            elements.input.value = '';
            elements.summary.classList.add('hidden');
            elements.grid.innerHTML = '';
            activeFilter = null;
            updateHash(null, null);
        }

        // HASH ROUTING LOGIC (Perfect for GitHub Pages)
        function handleRouting() {
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#/')) return;

            // Remove '#/' and split by '/'
            const parts = hash.substring(2).split('/'); 
            const langFromUrl = parts[0];
            const pinFromUrl = parts[1];
            const poFromUrl = parts[2] ? decodeURIComponent(parts[2]) : null;

            if (langFromUrl === 'english' && currentLang !== 'en') {
                currentLang = 'en';
                applyLanguage();
            } else if (langFromUrl === 'odia' && currentLang !== 'or') {
                currentLang = 'or';
                applyLanguage();
            }

            if (pinFromUrl && /^\d{6}$/.test(pinFromUrl)) {
                elements.input.value = pinFromUrl;
                searchPincode(pinFromUrl, poFromUrl, false); 
            }
        }

        function updateHash(pin, poName = null) {
            if (!pin) {
                window.history.pushState(null, '', window.location.pathname);
                return;
            }

            const langStr = currentLang === 'or' ? 'odia' : 'english';
            let newHash = `#/${langStr}/${pin}`;
            if (poName) {
                newHash += `/${encodeURIComponent(poName.toLowerCase())}`;
            }

            if (window.location.hash !== newHash) {
                window.history.pushState(null, '', newHash);
            }
        }

        function validateInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            if(input.value.length === 6) searchPincode();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'or' ? 'en' : 'or';
            localStorage.setItem('appLang', currentLang);
            applyLanguage();
            
            if (elements.pinSpan.innerText.length >= 6) {
                updateHash(elements.input.value, activeFilter);
            }
            if (currentPostOffices.length > 0) renderResults(currentPostOffices, activeFilter);
        }

        function applyLanguage() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang; 
            document.title = t.title;
            document.getElementById('header-title').innerText = t.title;
            document.getElementById('lang-toggle').innerText = t.toggleBtn;
            elements.input.placeholder = t.placeholder;
            document.getElementById('search-btn').innerText = t.searchBtn;
            document.getElementById('loading-text').innerText = t.loading;
            document.getElementById('copy-btn-text').innerText = t.copyBtn;
            document.getElementById('share-btn-text').innerText = t.shareBtn;
            document.getElementById('summary-text').innerText = t.summaryText;
            document.getElementById('footer-text').innerText = t.footerText;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        // --- Fetch API Logic ---
        async function searchPincode(pinOverride = null, targetPO = null, updateUrl = true) {
            const pincode = pinOverride || elements.input.value;
            
            elements.error.classList.add('hidden');
            elements.summary.classList.add('hidden');
            elements.grid.innerHTML = '';
            
            if (pincode.length !== 6) {
                elements.error.innerText = i18n[currentLang].invalidLength;
                elements.error.classList.remove('hidden');
                return;
            }

            if (updateUrl) updateHash(pincode, targetPO);

            elements.loading.classList.remove('hidden');
            elements.loading.classList.add('flex');

            try {
                const response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                const data = await response.json();

                elements.loading.classList.add('hidden');
                elements.loading.classList.remove('flex');

                if (data[0].Status === "Success") {
                    currentPostOffices = data[0].PostOffice;
                    renderResults(currentPostOffices, targetPO);
                    elements.summary.classList.remove('hidden');
                } else {
                    currentPostOffices = [];
                    elements.error.innerText = i18n[currentLang].noData;
                    elements.error.classList.remove('hidden');
                }
            } catch (error) {
                elements.loading.classList.add('hidden');
                elements.error.innerText = "Network Error.";
                elements.error.classList.remove('hidden');
            }
        }

        // --- Rendering ---
        function renderResults(postOffices, targetPO = null) {
            elements.grid.innerHTML = '';
            const t = i18n[currentLang];
            activeFilter = targetPO;
            
            // Show/Hide back arrow based on filter
            elements.clearBtn.classList.toggle('hidden', !targetPO);
            elements.pinSpan.innerText = targetPO ? `${elements.input.value} ➔ ${targetPO}` : elements.input.value;

            // Filter logic
            let dataToRender = postOffices;
            if (targetPO) {
                const filtered = postOffices.filter(po => po.Name.toLowerCase() === targetPO.toLowerCase());
                if(filtered.length > 0) dataToRender = filtered;
            }

            dataToRender.forEach((po, index) => {
                const mapLink = `https://www.google.com/maps/search/${encodeURIComponent(po.Name)}+${po.Pincode}`;

                const card = document.createElement('div');
                card.className = "md3-transition card-enter bg-white p-6 shadow hover:shadow-xl rounded-[24px] border border-indigo-50 flex flex-col h-full relative group";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-5">
                        <h3 class="text-2xl font-bold text-indigo-600 leading-tight w-5/6">${po.Name}</h3>
                        <button onclick="shareSpecificPO('${po.Name}')" class="text-gray-300 hover:text-indigo-600 transition-colors p-1" title="${t.sharePO}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                        </button>
                    </div>
                    <div class="space-y-4 text-[15px] mb-8 flex-grow">
                        <div class="flex justify-between items-center"><span class="font-bold text-indigo-900">${t.branchType}</span> <span class="text-gray-600">${po.BranchType}</span></div>
                        <div class="flex justify-between items-center"><span class="font-bold text-indigo-900">${t.delivery}</span> <span class="text-gray-600">${po.DeliveryStatus}</span></div>
                        <div class="flex justify-between items-center"><span class="font-bold text-indigo-900">${t.districtState}</span> <span class="text-gray-600 text-right w-1/2">${po.District}, ${po.State}</span></div>
                    </div>
                    <a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="md3-transition w-full flex items-center justify-center gap-2 bg-[#f0f4ff] text-indigo-800 py-3 rounded-full font-bold hover:bg-indigo-100 mt-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-700" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg>
                        ${t.mapBtn}
                    </a>
                `;
                elements.grid.appendChild(card);

                setTimeout(() => { requestAnimationFrame(() => { card.classList.remove('card-enter'); card.classList.add('card-enter-active'); }); }, index * 50); 
            });
        }

        function clearFilter() {
            activeFilter = null;
            renderResults(currentPostOffices, null);
            updateHash(elements.input.value, null);
        }

        // --- Sharing Functions (Using Hash URLs) ---
        function copyPincode() {
            navigator.clipboard.writeText(elements.input.value).then(() => showToast(i18n[currentLang].copied));
        }

        async function triggerShare(title, text, url) {
            if (navigator.share) {
                try { await navigator.share({ title, text, url }); } catch (err) { }
            } else {
                navigator.clipboard.writeText(url).then(() => showToast(i18n[currentLang].linkCopied));
            }
        }

        function shareMainLink() {
            const lang = currentLang === 'or' ? 'odia' : 'english';
            const pin = elements.input.value;
            // Build absolute URL with hash
            const url = window.location.origin + window.location.pathname + `#/${lang}/${pin}`;
            triggerShare(i18n[currentLang].title, `${i18n[currentLang].summaryText} ${pin}`, url);
        }

        function shareSpecificPO(poName) {
            const lang = currentLang === 'or' ? 'odia' : 'english';
            const pin = elements.input.value;
            // Build absolute URL with hash including post office
            const url = window.location.origin + window.location.pathname + `#/${lang}/${pin}/${encodeURIComponent(poName.toLowerCase())}`;
            
            // Auto update UI to show only this card when user clicks share
            if(activeFilter !== poName) {
                renderResults(currentPostOffices, poName);
                updateHash(pin, poName);
            }

            triggerShare(poName, `Post Office: ${poName}, Pincode: ${pin}`, url);
        }

        // Search on Enter key
        elements.input.addEventListener('keypress', e => { if (e.key === 'Enter') searchPincode(); });
    </script>
</body>
</html>
