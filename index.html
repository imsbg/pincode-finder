---
layout: default
---
<main class="flex-grow flex flex-col items-center px-4 py-12 w-full max-w-5xl mx-auto">
    
    <!-- Search Section -->
    <div class="w-full max-w-2xl relative flex flex-col items-center mb-10">
        <div class="w-full bg-indigo-50 p-2 border border-indigo-100 rounded-full shadow-sm flex items-center md3-transition focus-within:border-indigo-400 focus-within:shadow-md">
            <input type="text" id="pincode-input" class="w-full bg-transparent py-3 pl-6 pr-4 text-xl text-gray-800 placeholder-gray-500" maxlength="6" pattern="\d*" oninput="validateInput(this)" placeholder="୬-ଅଙ୍କ ବିଶିଷ୍ଟ ପିନକୋଡ୍...">
            <button id="search-btn" onclick="searchPincode()" class="md3-transition bg-indigo-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-indigo-700 hover:shadow-lg whitespace-nowrap">
                ଖୋଜନ୍ତୁ
            </button>
        </div>
        <p id="error-msg" class="text-red-500 text-sm mt-4 hidden font-medium bg-red-50 px-4 py-2 rounded-full"></p>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="hidden flex-col items-center justify-center py-10">
        <div class="spinner mb-5"></div>
        <p id="loading-text" class="text-indigo-800 font-medium text-lg">ଅନୁସନ୍ଧାନ କରାଯାଉଛି...</p>
    </div>

    <!-- Results Summary Header -->
    <div id="result-summary" class="hidden w-full mb-8 flex flex-wrap items-center justify-between bg-white px-6 py-5 rounded-2xl shadow-sm border border-indigo-50 md3-transition">
        <div class="flex items-center gap-3">
            <button id="clear-filter-btn" onclick="clearFilter()" class="hidden bg-indigo-100 text-indigo-800 p-2 rounded-full hover:bg-indigo-200" title="Show All">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
            </button>
            <h2 class="text-xl font-bold text-gray-800">
                <span id="summary-text">ଫଳାଫଳ:</span> <span id="searched-pin" class="text-indigo-600 ml-1"></span>
            </h2>
        </div>
        <div class="flex gap-3 mt-4 sm:mt-0">
            <button onclick="copyPincode()" class="md3-transition flex items-center gap-2 bg-indigo-50 text-indigo-800 px-4 py-2 rounded-full font-medium hover:bg-indigo-100 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                <span id="copy-btn-text">କପି କରନ୍ତୁ</span>
            </button>
            <button onclick="shareMainLink()" class="md3-transition flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-full font-medium hover:bg-indigo-700 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                <span id="share-btn-text">ସେୟାର କରନ୍ତୁ</span>
            </button>
        </div>
    </div>

    <!-- Results Grid -->
    <div id="results-grid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>
